[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recsys"
version = "2.0.0"
description = "Two-stage movie recommender: two-tower retrieval + DLRM ranking on MovieLens-32M, served with ONNX Runtime"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ahmed Khaled Ali", email = "phoniex199940@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "onnxruntime>=1.20",
]

[project.optional-dependencies]
train = ["torch>=2.4", "pandas>=2.2", "pyarrow>=17", "scipy>=1.13", "onnx>=1.17", "mlflow-skinny>=2.18"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.32"]
demo = ["gradio>=5.9"]
dev = ["pytest>=8", "ruff>=0.8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
"space/app.py" = ["E501"]
